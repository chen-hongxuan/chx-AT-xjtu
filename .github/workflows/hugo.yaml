name: Build and deploy blog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
      TYPST_VERSION: 0.15.1
      TYPST_LINUX_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
      TZ: Asia/Shanghai
    steps:
      - name: Get source files
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        shell: bash
        run: |
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Test content preparation and renderers
        shell: bash
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Detect TikZ diagrams
        id: tikz
        shell: bash
        run: |
          if grep -ERIli \
            --include='*.[mM][dD]' \
            --include='*.[mM][aA][rR][kK][dD][oO][wW][nN]' \
            '^[[:space:]]*(`{3,}|~{3,})tikz([[:space:]]|$)' content >/dev/null; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Cache rendered TikZ diagrams
        if: steps.tikz.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: static/generated/tikz
          key: tikz-${{ runner.os }}-${{ hashFiles('content/**/*.md', 'content/**/*.markdown') }}
          restore-keys: |
            tikz-${{ runner.os }}-

      - name: Install TikZ renderer
        if: steps.tikz.outputs.present == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-pictures \
            dvisvgm

      - name: Prepare Markdown and diagrams
        shell: bash
        run: |
          python3 scripts/prepare_hugo_content.py \
            --source content \
            --destination "${{ runner.temp }}/hugo-content" \
            --tikz-output static/generated/tikz

      - name: Build the blog
        shell: bash
        run: |
          hugo build --gc --minify \
            --contentDir "${{ runner.temp }}/hugo-content" \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/.cache/hugo"

      - name: Detect Typst math
        id: typst
        shell: bash
        run: |
          if grep -RFl --include='*.html' '<x-typst-math' public >/dev/null; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Cache rendered Typst formulas
        if: steps.typst.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/typst-svg
          key: typst-${{ runner.os }}-${{ env.TYPST_VERSION }}-${{ hashFiles('scripts/render_typst_math.py', 'typst/math-preamble.typ') }}-${{ hashFiles('content/**/*.md', 'content/**/*.markdown', 'layouts/_markup/render-passthrough.html', 'layouts/partials/typst-placeholder.html') }}
          restore-keys: |
            typst-${{ runner.os }}-${{ env.TYPST_VERSION }}-${{ hashFiles('scripts/render_typst_math.py', 'typst/math-preamble.typ') }}-

      - name: Install Typst
        if: steps.typst.outputs.present == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          archive="${{ runner.temp }}/typst.tar.xz"
          curl -sfL -o "${archive}" \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "${TYPST_LINUX_SHA256}  ${archive}" | sha256sum --check --status
          mkdir -p "${HOME}/.local/typst"
          tar -C "${HOME}/.local/typst" --strip-components=1 -xf "${archive}"
          echo "${HOME}/.local/typst" >> "${GITHUB_PATH}"

      - name: Smoke-test the Typst pipeline
        if: steps.typst.outputs.present == 'true'
        shell: bash
        run: |
          python3 scripts/prepare_hugo_content.py \
            --source scripts/fixtures/typst-content \
            --destination "${{ runner.temp }}/typst-smoke-content"
          hugo build --gc --minify \
            --contentDir "${{ runner.temp }}/typst-smoke-content" \
            --destination "${{ runner.temp }}/typst-smoke-public" \
            --baseURL "https://example.invalid/chx-AT-xjtu/" \
            --cacheDir "${{ runner.temp }}/.cache/hugo-typst-smoke"
          python3 scripts/render_typst_math.py \
            --public "${{ runner.temp }}/typst-smoke-public" \
            --cache "${{ runner.temp }}/typst-smoke-cache" \
            --preamble typst/math-preamble.typ
          if grep -RFl --include='*.html' --include='*.xml' \
            -e '<x-typst-math' -e '&lt;x-typst-math' \
            "${{ runner.temp }}/typst-smoke-public" >/dev/null; then
            echo "Typst placeholders remained after the smoke test" >&2
            exit 1
          fi
          TYPST_SMOKE_PUBLIC="${{ runner.temp }}/typst-smoke-public" \
            python3 -c 'import os; from pathlib import Path; import xml.etree.ElementTree as ET; [ET.parse(path) for path in Path(os.environ["TYPST_SMOKE_PUBLIC"]).rglob("*.xml")]'
          test "$(find "${{ runner.temp }}/typst-smoke-public/generated/typst" \
            -maxdepth 1 -name '*.svg' | wc -l)" -ge 1

      - name: Render Typst formulas
        if: steps.typst.outputs.present == 'true'
        shell: bash
        run: |
          python3 scripts/render_typst_math.py \
            --public public \
            --cache .cache/typst-svg \
            --preamble typst/math-preamble.typ
          if grep -RFl --include='*.html' --include='*.xml' \
            -e '<x-typst-math' -e '&lt;x-typst-math' \
            public >/dev/null; then
            echo "Typst placeholders remained in the published site" >&2
            exit 1
          fi

      - name: Upload the website
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
