{{ define "main" }}
  <section class="page-shell">
    <header class="page-heading">
      <p class="eyebrow">文章归档</p>
      <h1>{{ .Title }}</h1>
      {{ with .Content }}<div class="lead">{{ . }}</div>{{ end }}
    </header>
    <div class="post-grid">
      {{ range .Pages.ByDate.Reverse }}
        {{ partial "post-card.html" . }}
      {{ else }}
        <p class="empty-state">还没有文章。</p>
      {{ end }}
    </div>
  </section>
{{ end }}
