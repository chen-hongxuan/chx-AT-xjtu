{{ define "main" }}
  {{ $posts := where site.RegularPages "Section" "posts" }}
  <section class="hero">
    <p class="eyebrow">CHX(AT)XJTU</p>
    <h1>把学习过程<br>写成可以回看的知识。</h1>
    <p>关于 XCPC、数学、数理逻辑与理论计算机科学的个人学习笔记。</p>
    <div class="hero-actions">
      <a class="button button-primary" href="{{ "posts/" | relURL }}">浏览文章</a>
      <a class="button button-secondary" href="{{ "tags/" | relURL }}">查看标签树</a>
    </div>
  </section>

  <section class="home-section">
    <div class="section-heading">
      <div>
        <p class="eyebrow">最近更新</p>
        <h2>最新文章</h2>
      </div>
      <a href="{{ "posts/" | relURL }}">全部文章 →</a>
    </div>
    <div class="post-grid">
      {{ range first 6 $posts.ByDate.Reverse }}
        {{ partial "post-card.html" . }}
      {{ else }}
        <p class="empty-state">第一篇笔记正在路上。</p>
      {{ end }}
    </div>
  </section>
{{ end }}
