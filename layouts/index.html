{{ define "main" }}
  {{ $posts := where site.RegularPages "Section" "posts" }}
  <section class="hero">
    <p class="eyebrow">CHX(AT)XJTU</p>
    <h1>去往无穷的彼端</h1>
    <p>一个平凡的博客</p>
    <div class="hero-actions">
      <a class="button button-primary" href="{{ "posts/" | relURL }}">浏览文章</a>
      <a class="button button-secondary" href="{{ "tags/" | relURL }}">查看标签树</a>
    </div>
  </section>

  <section class="home-section">
    <div class="section-heading">
      <div>
        <p class="eyebrow">最近更新</p>
        <h2>最新文章</h2>
      </div>
      <a href="{{ "posts/" | relURL }}">全部文章 →</a>
    </div>
    <div class="post-grid">
      {{ range first 6 $posts.ByDate.Reverse }}
        {{ partial "post-card.html" . }}
      {{ else }}
        <p class="empty-state">第一篇笔记正在路上。</p>
      {{ end }}
    </div>
  </section>
{{ end }}
